name: ncxten-infra

services:
  vector:
    image: timberio/vector:0.59.0-alpine                # pinned; the CI workflow uses the same tag, move both together
    restart: unless-stopped
    env_file:                                           # BETTERSTACK_* — placeholders in .env (committed), real values in .env.local (git-ignored)
      - .env
      - path: .env.local
        required: false                                 # a fresh clone has none; Vector then runs with placeholders
    environment:
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"  # since 0.57 Vector leaves ${VAR} in vector.yaml literal without it
    volumes:
      - ../vector/vector.yaml:/etc/vector/vector.yaml:ro
      - ${HOME}/.local/state/ncxten/events:/events:ro  # the directory of project.paths.events, never paths.state; create it first (README)
      - ${HOME}/.local/state/ncxten/vector:/var/lib/vector  # checkpoints + disk buffer; a host path, not a named volume
    mem_limit: 128m

  ncxten:
    build:
      context: ../..                                    # the repo root (.dockerignore applies)
      dockerfile: docker/ncxten/Dockerfile
    restart: unless-stopped
    # No `user:` here — this box runs rootless Docker, where root in the container is the
    # host user, so files on the volumes belong to you. A rootful daemon needs
    # `user: "<uid>:<gid>"` instead (README).
    environment:
      HOME: ${HOME}                                     # so the CLI defaults (~/.config, ~/.local/state) hit the mounts below
      # The factory-owned config home for the shipped claude CLI (FR-065/095): under the
      # state mount, so the login survives an image rebuild. Seed it once with a
      # .credentials.json (or `docker exec -it <container> claude /login`); the operator
      # never accepts a trust dialog there beyond the login (002 contracts/run.md).
      CLAUDE_CONFIG_DIR: ${HOME}/.local/state/ncxten/claude-config
      DISABLE_AUTOUPDATER: "1"                          # the image pins the version
    volumes:
      # Mounted at the SAME paths as on the host (STACK Deployment: the daemon resolves
      # bind mounts on the host; the CLI runs via docker exec in the same PID namespace).
      # The state mount also carries the repo checkouts (repos/<owner>/<repo>/current) and
      # the claude config home: a policy's repo.paths.checkout MUST resolve inside a
      # mounted path, or the first session dies at its first git call (002).
      - ${HOME}/.config/ncxten:${HOME}/.config/ncxten             # policies, read-write
      - ${HOME}/.local/state/ncxten:${HOME}/.local/state/ncxten   # state root: events/ + projects/ + repos/ + claude-config/
